{% extends "utils/base.html" %}

{% block content %}
<div class="container mt-2 pt-4 pb-5">
<div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <h2 class="text-center text-dark mt-5">Register Form</h2>
        <div class="card my-5">

          <form method="post" class="card-body cardbody-color p-lg-5">
            {% include 'utils/alerts.html' %}  
            {% csrf_token %}
            <div class="text-center">
              <img src="https://cdn.pixabay.com/photo/2016/03/31/19/56/avatar-1295397__340.png" class="img-fluid profile-image-pic img-thumbnail rounded-circle my-3"
                width="200px" alt="profile">
            </div>

            <div class="mb-3">
              <input type="text" class="form-control" name="first_name" aria-describedby="emailHelp"
                placeholder="First Name">
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" name="last_name" aria-describedby="emailHelp"
                placeholder="Last Name">
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" name="business_name" aria-describedby="emailHelp"
                placeholder="Business Name">
            </div>
            <div class="mb-3">
              <input type="email" class="form-control" name="email" placeholder="email">
            </div>
            <!-- <div class="mb-3">
              <input type="number" class="form-control" id="phone" placeholder="Phone Number" aria-describedby="emailhelp">
            </div> -->
            <div class="mb-3">
              <input type="password" class="form-control" name="password" placeholder="password">
            </div>
            <div class="text-center"><button type="submit" class="btn btn-color px-5 mb-5 w-100">Register</button></div>
            <div id="emailHelp" class="form-text text-center mb-5 text-dark">Already
              Registered? <a href="{% url 'login' %}" class="text-dark fw-bold"> Login</a>
            </div>
          </form>
        </div>
</div>
      </div>
    </div>
  </div>

{% endblock %}
