{% extends "utils/base.html" %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

  <div class="col-md-5">
    <h2 class="text-center text-dark mb-4">Vendor Registration</h2>

    <div class="card">

      <form method="post" class="card-body p-lg-4">
        {% include 'utils/alerts.html' %}
        {% csrf_token %}

        <div class="text-center">
          <img src="https://cdn.pixabay.com/photo/2016/03/31/19/56/avatar-1295397__340.png"
               class="img-fluid img-thumbnail rounded-circle my-3"
               width="120" alt="profile">
        </div>

        <div class="mb-3">
          <input type="text" class="form-control" name="first_name" placeholder="First Name">
        </div>

        <div class="mb-3">
          <input type="text" class="form-control" name="last_name" placeholder="Last Name">
        </div>

        <div class="mb-3">
          <input type="text" class="form-control" name="business_name" placeholder="Business Name">
        </div>

        <div class="mb-3">
          <input type="email" class="form-control" name="email" placeholder="Email">
        </div>

        <div class="mb-3">
          <input type="password" class="form-control" name="password" placeholder="Password">
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </div>

        <div class="text-center mt-3">
          Already Registered?
          <a href="{% url 'vendor_login' %}" class="fw-bold">Login</a>
        </div>

      </form>

    </div>
  </div>

</div>

{% endblock %}
