{% extends 'utils/vendor_base.html' %}

{% block content %}

<div class="container mt-5 pt-5 pb-5">
    <div class="col 5 mx auto card shadow p-4" style="border:none">
    <h2>Add Hotel</h2>
    <form method="post" enctype="multipart/form-data">
        {% include 'utils/alerts.html' %}
        {% csrf_token %}

        <div class="mb-3">
            <label for="hotel_name" class="form-label">Hotel Name</label>
            <input type="text" class="form-control" name="hotel_name" id="hotel_name" placeholder="Hotel Name">
        </div>
        <div class="mb-3">
            <label for="hotel_image" class="form-label">Profile</label>
            <input type="file" class="form-control" name="hotel_image" id="hotel_image" placeholder="Hotel Profile">
        </div>
        <div class="mb-3">
            <label for="hotel_description" class="form-label">Description</label>
            <input type="text" class="form-control" name="hotel_description" id="hotel_description" placeholder="Hotel Description">
        </div>
        <div class="mb-3">
            <label for="hotel_location" class="form-label">Hotel Location</label>
            <input type="text" class="form-control" name="hotel_location" id="hotel_location" placeholder="Hotel Location">
        </div>
        <div class="mb-3">
            <label for="hotel_price" class="form-label">Hotel Price</label>
            <input type="number" class="form-control" name="hotel_price" id="hotel_price" placeholder="Hotel Price">
        </div>
        <div class="mb-3">
            <label for="hotel_offer_price" class="form-label">Hotel Offer Price</label>
            <input type="number" class="form-control" name="hotel_offer_price" id="hotel_offer_price" placeholder="Hotel Offer Price">
        </div>
<div class="mb-3">
    <label class="form-label">Amenities</label>

    <div class="row">
        {% for amenetie in ameneties %}
        <div class="col-md-4">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="hotel_ameneties"
                       value="{{ amenetie.id }}"
                       id="amenetie{{ amenetie.id }}">

                <label class="form-check-label" for="amenetie{{ amenetie.id }}">
                    {{ amenetie.amenetie_name }}
                </label>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
        <div class="mb-3">
            <label for="is_available" class="form-label">Is Available</label>
            <select class="form-select" name="is_available" id="is_available">
                <option value="True">True</option>
                <option value="False">False</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Add Hotel</button>
    </form>
    </div>
</div>
{% endblock %}
