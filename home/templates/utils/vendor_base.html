<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OYO CLONE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'home' %}">
          <img class="bg-white" src="/static/oyo.png" alt="logo" width="30" height="24">
        </a>

        <!-- Toggle Button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Menu -->
        <div class="collapse navbar-collapse" id="navbarMenu">

          <ul class="navbar-nav me-auto mb-3 mb-lg-0">

            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'home' %}">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'my_bookings' %}">My Bookings</a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'vendor_dashboard' %}">Vendor Dashboard</a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-white" href="">About</a>
            </li>

          </ul>

          <div class="d-flex">

            {% if request.user.is_authenticated %}

            <a href="{% url 'vendor_logout' %}" class="btn btn-danger">
            Logout
            </a>

            {% else %}

            <a href="{% url 'login' %}" class="btn btn-light me-2">
            Login
            </a>

            <a href="{% url 'register' %}" class="btn btn-dark">
            Register
            </a>

            {% endif %}

            </div>

        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="flex-grow-1">
      {% block content %}
      {% endblock %}
    </div>

    <!-- Footer -->
    <div class="bg-dark p-5 mt-auto">
      <p class="text-center text-white">
        All right reserved 2026. OYO CLONE |
        <a href="{% url 'vendor_login' %}" class="text-white">Login Vendor</a> |
        <a href="{% url 'vendor_register' %}" class="text-white">Register Vendor</a>
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
